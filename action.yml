name: 'RL Check'
description: 'Run rl check on your repository using the RL language'
author: 'MohamedGonem'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  version:
    description: 'RL version to use (e.g., v0.1.4, latest, nightly). Defaults to v0.1.4'
    required: false
    default: 'v0.1.4'
  file:
    description: 'File to check (e.g., main.rl). Ignored if folder is set.'
    required: false
    default: ''
  folder:
    description: 'Folder to check (e.g., nano/, cd/). Runs rl check on every .rl file directly inside it.'
    required: false
    default: ''
  args:
    description: 'Additional arguments to pass to rl check'
    required: false
    default: ''
  working-directory:
    description: 'Working directory to run rl check in'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install RL binary
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        case $ARCH in
          x86_64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
          *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        case $OS in
          linux) TARGET_OS="unknown-linux-gnu" ;;
          darwin) TARGET_OS="apple-darwin" ;;
          windows|mingw*|msys*) TARGET_OS="pc-windows-msvc" ;;
          *) echo "Unsupported OS: $OS"; exit 1 ;;
        esac

        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          echo "Fetching latest RL version..."
          VERSION=$(curl -s https://api.github.com/repos/rl-lang/rl-lang/releases/latest | grep -o '"tag_name": "[^"]*' | cut -d'"' -f4)
          if [ -z "$VERSION" ]; then
            echo "Failed to get latest version"
            exit 1
          fi
          echo "Latest version: $VERSION"
        elif [ "$VERSION" = "nightly" ]; then
          echo "Using nightly release"
          VERSION="nightly"
        else
          echo "Using specified version: $VERSION"
        fi

        BINARY_NAME="rl"
        if [[ "$TARGET_OS" == "pc-windows-msvc" ]]; then
          BINARY_NAME="rl.exe"
        fi

        DOWNLOAD_URL="https://github.com/rl-lang/rl-lang/releases/download/${VERSION}/${BINARY_NAME}"

        echo "Downloading RL from ${DOWNLOAD_URL}"
        mkdir -p /usr/local/bin
        curl -L -o /usr/local/bin/rl "${DOWNLOAD_URL}"

        if [[ "$TARGET_OS" != "pc-windows-msvc" ]]; then
          chmod +x /usr/local/bin/rl
        fi

        echo "✅ RL installed successfully!"
        /usr/local/bin/rl --version 2>/dev/null || echo "⚠️  Version check failed but binary is installed"

    - name: Run rl check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        FOLDER="${{ inputs.folder }}"
        FILE="${{ inputs.file }}"

        if [ -n "$FOLDER" ]; then
          if [ ! -d "$FOLDER" ]; then
            echo "❌ Folder not found: $FOLDER"
            exit 1
          fi

          echo "Checking all .rl files in $FOLDER"
          cd "$FOLDER"

          FAIL=0
          COUNT=0
          for f in *.rl; do
            [ -e "$f" ] || continue
            COUNT=$((COUNT+1))
            echo "::group::rl check $f"
            if /usr/local/bin/rl check "$f" ${{ inputs.args }}; then
              echo "✅ $f"
            else
              echo "❌ $f"
              FAIL=1
            fi
            echo "::endgroup::"
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No .rl files found in $FOLDER"
            exit 1
          fi

          exit $FAIL
        elif [ -n "$FILE" ]; then
          echo "Running: rl check ${{ inputs.file }} ${{ inputs.args }}"
          /usr/local/bin/rl check "${{ inputs.file }}" ${{ inputs.args }}
        else
          echo "❌ Must set either 'file' or 'folder'"
          exit 1
        fi