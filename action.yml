name: 'RL Check'
description: 'Run rl check on your repository using the RL language'
author: 'MohamedGonem'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  version:
    description: 'RL version to use (e.g., v0.1.4). Defaults to v0.1.4'
    required: false
    default: 'v0.1.4'
  file:
    description: 'File to check (e.g., main.rl)'
    required: true
  args:
    description: 'Additional arguments to pass to rl check'
    required: false
    default: ''
  working-directory:
    description: 'Working directory to run rl check in'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install RL binary
      shell: bash
      run: |
        # Detect OS and architecture
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        
        # Map architecture
        case $ARCH in
          x86_64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
          *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        
        # Map OS to target format
        case $OS in
          linux) TARGET_OS="unknown-linux-gnu" ;;
          darwin) TARGET_OS="apple-darwin" ;;
          windows|mingw*|msys*) TARGET_OS="pc-windows-msvc" ;;
          *) echo "Unsupported OS: $OS"; exit 1 ;;
        esac
        
        # Determine which version to download
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          echo "Fetching latest RL version..."
          VERSION=$(curl -s https://api.github.com/repos/rl-lang/rl-lang/releases/latest | grep -o '"tag_name": "[^"]*' | cut -d'"' -f4)
          if [ -z "$VERSION" ]; then
            echo "Failed to get latest version"
            exit 1
          fi
          echo "Latest version: $VERSION"
        else
          echo "Using specified version: $VERSION"
        fi
        
        # Set binary name
        BINARY_NAME="rl"
        if [[ "$TARGET_OS" == "pc-windows-msvc" ]]; then
          BINARY_NAME="rl.exe"
        fi
        
        # Construct download URL
        DOWNLOAD_URL="https://github.com/rl-lang/rl-lang/releases/download/${VERSION}/${BINARY_NAME}"
        
        # Download binary
        echo "Downloading RL from ${DOWNLOAD_URL}"
        mkdir -p /usr/local/bin
        curl -L -o /usr/local/bin/rl "${DOWNLOAD_URL}"
        
        # Make executable (not needed on Windows)
        if [[ "$TARGET_OS" != "pc-windows-msvc" ]]; then
          chmod +x /usr/local/bin/rl
        fi
        
        # Verify installation
        echo "✅ RL installed successfully!"
        /usr/local/bin/rl --version 2>/dev/null || echo "⚠️  Version check failed but binary is installed"

    - name: Run rl check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Running: rl check ${{ inputs.file }} ${{ inputs.args }}"
        /usr/local/bin/rl check "${{ inputs.file }}" ${{ inputs.args }}
